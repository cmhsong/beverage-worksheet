<title>음료 조제 학습지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">

<style>
  /* layout: title header → category tabs (color-coded) → beverage grid cards → recipe view with pictogram ingredients (fill-level cups, count badges) and numbered checkable steps */

  :root {
    /* paper-warm neutrals + vivid, distinct category colors — pictograms carry info so surfaces stay quiet */
    --bg: #F2EDE2;
    --surface: #FFFFFF;
    --surface-2: #FAF4E7;
    --ink: #2A231D;
    --ink-soft: #6E6155;
    --ink-faint: #A69A8C;
    --line: #DED1BD;
    --line-soft: #EEE4D1;
    --accent: #7D4F2E;
    --focus: #D97757;
    --shadow: 0 2px 0 rgba(0,0,0,.04), 0 8px 24px rgba(79,52,25,.08);
    --shadow-lift: 0 4px 0 rgba(0,0,0,.04), 0 12px 32px rgba(79,52,25,.14);

    --coffee: #6B4226;
    --coffee-tint: #F2E3CF;
    --tea: #3B7A4F;
    --tea-tint: #DBECDF;
    --ade: #D88A1C;
    --ade-tint: #FBE9C3;
    --smoothie: #BE4876;
    --smoothie-tint: #F8D7E2;

    --water: #94C9E6;
    --milk: #FFF9E2;
    --coffee-liquid: #4A2A14;
    --tea-green: #8EC56A;
    --tea-amber: #D59238;
    --ade-yellow: #F4CE3F;
    --ade-pink: #F08BB3;
    --strawberry: #E0516D;
    --blueberry: #7B5EB1;
    --mango: #F2B33E;

    --radius: 18px;
    --radius-sm: 10px;
    --radius-lg: 28px;
    --font-display: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;

    --cat-color: var(--coffee);
    --cat-tint: var(--coffee-tint);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1813;
      --surface: #2A241D;
      --surface-2: #342C24;
      --ink: #F6EFE3;
      --ink-soft: #BDB1A1;
      --ink-faint: #85796C;
      --line: #4A3E31;
      --line-soft: #3A3127;
      --accent: #E3B07C;
      --focus: #EBA07F;
      --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lift: 0 4px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.5);

      --coffee: #D9A878;
      --coffee-tint: #3A2A1E;
      --tea: #8DC66E;
      --tea-tint: #253324;
      --ade: #F2B44D;
      --ade-tint: #3B2E1A;
      --smoothie: #ED92B0;
      --smoothie-tint: #3C2531;

      --milk: #F2EADC;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1813;
    --surface: #2A241D;
    --surface-2: #342C24;
    --ink: #F6EFE3;
    --ink-soft: #BDB1A1;
    --ink-faint: #85796C;
    --line: #4A3E31;
    --line-soft: #3A3127;
    --accent: #E3B07C;
    --focus: #EBA07F;
    --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    --shadow-lift: 0 4px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.5);
    --coffee: #D9A878;
    --coffee-tint: #3A2A1E;
    --tea: #8DC66E;
    --tea-tint: #253324;
    --ade: #F2B44D;
    --ade-tint: #3B2E1A;
    --smoothie: #ED92B0;
    --smoothie-tint: #3C2531;
    --milk: #F2EADC;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  body {
    margin: 0;
    font-weight: 500;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 56px; }

  header.top {
    text-align: center;
    padding: 20px 8px 18px;
    margin-bottom: 18px;
    position: relative;
  }
  header.top::after {
    content: "";
    display: block;
    width: 60%;
    height: 0;
    border-bottom: 3px dashed var(--line);
    margin: 18px auto 0;
  }
  header.top h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 5.4vw, 46px);
    margin: 0 0 6px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  header.top p {
    margin: 0;
    color: var(--ink-soft);
    font-size: clamp(14px, 2.5vw, 17px);
    font-weight: 700;
  }
  header.top .decor {
    display: inline-flex;
    gap: 10px;
    font-size: 22px;
    margin-bottom: 6px;
    opacity: 0.8;
  }

  /* Category tabs */
  nav.tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 10px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 1 0 auto;
    min-width: 112px;
    padding: 14px 18px;
    border: 2.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform .15s, background .2s, border-color .2s, color .2s;
  }
  .tab:hover { transform: translateY(-2px); border-color: var(--tab-color); }
  .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .tab[aria-selected="true"] {
    background: var(--tab-color);
    border-color: var(--tab-color);
    color: #fff;
  }
  .tab .emoji { font-size: 24px; line-height: 1; }

  /* Menu grid */
  .menu {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .menu[hidden] { display: none; }

  .card {
    background: var(--surface);
    border: 2.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 14px 18px;
    text-align: center;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, border-color .2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 0;
    font: inherit;
    color: inherit;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); border-color: var(--cat-color); }
  .card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .card .thumb {
    width: 86px;
    height: 86px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--cat-tint);
    color: var(--cat-color);
  }
  .card .thumb svg { width: 68px; height: 68px; display: block; }
  .card h3 {
    font-family: var(--font-display);
    font-size: 20px;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.3px;
  }
  .card .sub {
    font-size: 11.5px;
    color: var(--ink-faint);
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  /* Recipe view */
  .recipe {
    background: var(--surface);
    border: 2.5px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow);
    margin-top: 10px;
  }
  .recipe[hidden] { display: none; }

  .recipe-head {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 3px dashed var(--line);
    margin-bottom: 20px;
  }
  .back-btn {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--surface-2);
    border: 2.5px solid var(--line);
    color: var(--ink);
    font-size: 24px;
    cursor: pointer;
    flex-shrink: 0;
    font-family: var(--font-display);
    line-height: 1;
    padding: 0;
  }
  .back-btn:hover { background: var(--line-soft); }
  .back-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .recipe-title { flex: 1; min-width: 0; }
  .recipe-title .cat-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--cat-tint);
    color: var(--cat-color);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .recipe-title h2 {
    font-family: var(--font-display);
    font-size: clamp(26px, 4.5vw, 36px);
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.3px;
  }
  .recipe-icon {
    width: 76px;
    height: 76px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--cat-tint);
    color: var(--cat-color);
    flex-shrink: 0;
  }
  .recipe-icon svg { width: 60px; height: 60px; display: block; }

  .section-title {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--ink);
    margin: 24px 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: "";
    width: 8px;
    height: 26px;
    background: var(--cat-color);
    border-radius: 4px;
  }

  /* Ingredients */
  .ingredients {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
    gap: 14px;
  }
  .ing {
    background: var(--surface-2);
    border: 2.5px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 10px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: var(--cat-color);
  }
  .ing .vis {
    width: 94px;
    height: 94px;
    display: grid;
    place-items: center;
  }
  .ing .vis svg { width: 100%; height: 100%; display: block; }
  .ing .ing-name {
    font-family: var(--font-display);
    font-size: 17px;
    color: var(--ink);
  }
  .ing .ing-amt {
    display: inline-block;
    background: var(--surface);
    color: var(--cat-color);
    padding: 3px 12px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 900;
    border: 2px solid var(--cat-color);
    font-family: var(--font-display);
  }

  /* Steps */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface-2);
    border: 2.5px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: background .2s, border-color .2s, opacity .2s;
    user-select: none;
    text-align: left;
    font: inherit;
    color: inherit;
    width: 100%;
  }
  .step:hover { background: var(--line-soft); border-color: var(--cat-color); }
  .step:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .step[aria-checked="true"] {
    background: var(--cat-tint);
    border-color: var(--cat-color);
    opacity: 0.72;
  }
  .step[aria-checked="true"] .step-text {
    text-decoration: line-through;
    text-decoration-color: var(--cat-color);
    text-decoration-thickness: 2px;
  }
  .step .num {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--cat-color);
    color: #fff;
    font-family: var(--font-display);
    font-size: 22px;
    flex-shrink: 0;
    line-height: 1;
  }
  .step .step-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    background: var(--surface);
    border-radius: 50%;
    border: 2.5px solid var(--line);
    color: var(--cat-color);
    flex-shrink: 0;
  }
  .step .step-icon svg { width: 30px; height: 30px; display: block; }
  .step .step-text {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
    min-width: 0;
    word-break: keep-all;
  }
  .step .step-check {
    width: 38px;
    height: 38px;
    border: 3px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    position: relative;
  }
  .step[aria-checked="true"] .step-check {
    background: var(--cat-color);
    border-color: var(--cat-color);
  }
  .step[aria-checked="true"] .step-check::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 9px;
    border-left: 4px solid #fff;
    border-bottom: 4px solid #fff;
    transform: rotate(-45deg) translate(1px, -2px);
    left: 7px;
    top: 10px;
  }

  /* Done banner */
  .done-banner {
    display: none;
    text-align: center;
    padding: 22px 18px;
    margin-top: 20px;
    background: linear-gradient(135deg, var(--cat-tint) 0%, var(--surface-2) 100%);
    border: 3px dashed var(--cat-color);
    border-radius: var(--radius);
    font-family: var(--font-display);
    font-size: clamp(22px, 4vw, 28px);
    color: var(--cat-color);
    animation: pop .4s ease-out;
    letter-spacing: -0.3px;
  }
  .done-banner.show { display: block; }
  .done-banner .big { font-size: 48px; display: block; margin-bottom: 8px; line-height: 1; }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .done-banner { animation: none; }
    .card, .step, .tab { transition: none; }
  }

  .reset-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 10px 16px;
    background: var(--surface-2);
    border: 2px solid var(--line);
    border-radius: 12px;
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .reset-btn:hover { background: var(--line-soft); color: var(--ink); }
  .reset-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Theme toggle */
  .theme-tog {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--surface);
    border: 2.5px solid var(--line);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 10;
    color: var(--ink);
    padding: 0;
  }
  .theme-tog:hover { background: var(--surface-2); }
  .theme-tog:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 500px) {
    .wrap { padding-block: 14px 90px; }
    header.top { padding: 14px 8px 12px; margin-bottom: 10px; }
    .ingredients { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .menu { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { padding: 12px 10px 14px; }
    .card .thumb { width: 72px; height: 72px; }
    .card .thumb svg { width: 56px; height: 56px; }
    .card h3 { font-size: 18px; }
    .recipe { padding: 16px 14px; border-radius: 22px; }
    .recipe-head { gap: 10px; padding-bottom: 14px; }
    .recipe-icon { width: 60px; height: 60px; }
    .recipe-icon svg { width: 46px; height: 46px; }
    .back-btn { width: 42px; height: 42px; font-size: 20px; }
    .section-title { font-size: 20px; margin: 20px 0 12px; }
    .section-title::before { height: 22px; }
    .ing { padding: 10px 6px 10px; }
    .ing .vis { width: 76px; height: 76px; }
    .ing .ing-name { font-size: 15px; }
    .ing .ing-amt { font-size: 13px; padding: 2px 10px; }
    .step .step-text { font-size: 15.5px; }
    .step { padding: 11px 12px; gap: 10px; border-radius: 14px; }
    .step .num { width: 34px; height: 34px; font-size: 18px; }
    .step .step-icon { width: 40px; height: 40px; }
    .step .step-icon svg { width: 26px; height: 26px; }
    .step .step-check { width: 32px; height: 32px; }
    .step[aria-checked="true"] .step-check::after { width: 13px; height: 7px; left: 6px; top: 9px; }
    .tab { font-size: 17px; padding: 11px 12px; min-width: 92px; }
    .tab .emoji { font-size: 20px; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="decor" aria-hidden="true">☕ 🍵 🍋 🍓</div>
    <h1>음료 조제 학습지</h1>
    <p>그림을 보고 하나씩 따라해 보아요</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="음료 종류" id="tabs"></nav>
  <main class="menu" id="menu" role="list"></main>
  <section class="recipe" id="recipe" hidden aria-live="polite"></section>
</div>

<button class="theme-tog" id="themeTog" aria-label="밝게 또는 어둡게 전환" title="밝게 / 어둡게">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<script>
  // Unique id generator for SVG defs
  let _svgId = 0;
  const uid = () => `s${++_svgId}`;

  /* ============ Pictograms ============ */

  // Measuring cup/glass with fluid at `level` (0-1); label is a bold fraction on the right
  function cup(level, fluid, label) {
    const id = uid();
    const w = 100, h = 110;
    const topY = 15, botY = 95;
    const leftTop = 24, rightTop = 76;
    const leftBot = 32, rightBot = 68;
    const fillY = topY + (botY - topY) * (1 - level);
    const marks = [0.25, 0.5, 0.75];
    return `
      <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="${id}">
            <path d="M${leftTop} ${topY} L${rightTop} ${topY} L${rightBot} ${botY} Q${rightBot+2} ${botY+4} ${rightBot-4} ${botY+4} L${leftBot+4} ${botY+4} Q${leftBot-2} ${botY+4} ${leftBot} ${botY} Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#${id})">
          <rect x="0" y="${fillY}" width="${w}" height="${h}" fill="${fluid}"/>
        </g>
        <path d="M${leftTop} ${topY} L${rightTop} ${topY} L${rightBot} ${botY} Q${rightBot+2} ${botY+4} ${rightBot-4} ${botY+4} L${leftBot+4} ${botY+4} Q${leftBot-2} ${botY+4} ${leftBot} ${botY} Z"
                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="50" cy="${topY}" rx="26" ry="3.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
        ${marks.map(m => {
          const y = topY + (botY - topY) * (1 - m);
          const t = (y - topY) / (botY - topY);
          const lx = leftTop + (leftBot - leftTop) * t;
          return `<line x1="${lx+1}" y1="${y}" x2="${lx+8}" y2="${y}" stroke="currentColor" stroke-width="1.8" opacity="0.45"/>`;
        }).join('')}
        <rect x="56" y="${fillY-11}" width="34" height="22" rx="6" fill="currentColor"/>
        <text x="73" y="${fillY+5}" font-family="Jua, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="900">${label}</text>
      </svg>
    `;
  }

  // Glass with ice cubes stacked up to `level`
  function iceCup(level, label) {
    const id = uid();
    const w = 100, h = 110;
    const topY = 15, botY = 95;
    const leftTop = 24, rightTop = 76;
    const leftBot = 32, rightBot = 68;
    const fillY = topY + (botY - topY) * (1 - level);
    const cubes = [
      { x: 38, y: botY - 18, s: 14, r: 8 },
      { x: 54, y: botY - 30, s: 13, r: -10 },
      { x: 36, y: botY - 42, s: 13, r: 6 },
      { x: 52, y: botY - 54, s: 12, r: -8 },
      { x: 40, y: botY - 65, s: 12, r: 14 },
      { x: 55, y: botY - 76, s: 11, r: -6 },
    ];
    const visibleCubes = cubes.filter(c => c.y >= fillY - 4);
    return `
      <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          { ic: 'done',  t: '블루베리 스무디 완성!' },

  };

  /* ============ UI ============ */
  const tabsEl = document.getElementById('tabs');
  const menuEl = document.getElementById('menu');
  const recipeEl = document.getElementById('recipe');
  const themeTog = document.getElementById('themeTog');

  let currentCat = 'coffee';
  let currentBev = null;
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem('bev_prog') || '{}'); } catch (e) {}

  function saveProgress() {
    try { localStorage.setItem('bev_prog', JSON.stringify(progress)); } catch (e) {}
  }

  function setCatVars(target, cat) {
    const c = categories[cat];
    target.style.setProperty('--cat-color', c.color);
    target.style.setProperty('--cat-tint', c.tint);
  }

  function renderTabs() {
    tabsEl.innerHTML = Object.entries(categories).map(([k, c]) => `
      <button class="tab" type="button" role="tab" data-cat="${k}" aria-selected="${k === currentCat}"
              style="--tab-color:${c.color}">
        <span class="emoji" aria-hidden="true">${c.emoji}</span>
        <span>${c.label}</span>
      </button>
    `).join('');
    tabsEl.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        if (t.dataset.cat === currentCat && recipeEl.hidden) return;
        currentCat = t.dataset.cat;
        currentBev = null;
        setCatVars(document.documentElement, currentCat);
        renderTabs();
        renderMenu();
        recipeEl.hidden = true;
        menuEl.hidden = false;
      });
    });
  }

  function renderMenu() {
    const items = BEV[currentCat] || [];
    setCatVars(menuEl, currentCat);
    menuEl.innerHTML = items.map(b => `
      <button class="card" type="button" data-id="${b.id}" role="listitem">
        <div class="thumb">${b.thumb()}</div>
        <h3>${b.name}</h3>
        <div class="sub">${b.sub}</div>
      </button>
    `).join('');
    menuEl.querySelectorAll('.card').forEach(c => {
      c.addEventListener('click', () => openRecipe(c.dataset.id));
    });
  }

  function openRecipe(id) {
    const b = (BEV[currentCat] || []).find(x => x.id === id);
    if (!b) return;
    currentBev = b;
    const key = `${currentCat}:${id}`;
    const checked = progress[key] || {};
    const col = categories[currentCat];
    setCatVars(recipeEl, currentCat);

    recipeEl.innerHTML = `
      <div class="recipe-head">
        <button class="back-btn" type="button" id="backBtn" aria-label="메뉴로 돌아가기">←</button>
        <div class="recipe-title">
          <span class="cat-label"><span aria-hidden="true">${col.emoji}</span> ${col.label}</span>
          <h2>${b.name}</h2>
        </div>
        <div class="recipe-icon">${b.thumb()}</div>
      </div>

      <h3 class="section-title">준비물</h3>
      <div class="ingredients">
        ${b.ings.map(i => `
          <div class="ing">
            <div class="vis">${i.vis()}</div>
            <div class="ing-name">${i.name}</div>
            <div class="ing-amt">${i.amt}</div>
          </div>
        `).join('')}
      </div>

      <h3 class="section-title">만드는 순서</h3>
      <div class="steps">
        ${b.steps.map((s, idx) => `
          <button class="step" type="button" role="checkbox" tabindex="0" data-idx="${idx}"
                  aria-checked="${checked[idx] ? 'true' : 'false'}">
            <span class="num">${idx + 1}</span>
            <span class="step-icon" aria-hidden="true">${stepIcons[s.ic] || stepIcons.cup}</span>
            <span class="step-text">${s.t}</span>
            <span class="step-check" aria-hidden="true"></span>
          </button>
        `).join('')}
      </div>

      <div class="done-banner" id="doneBanner">
        <span class="big" aria-hidden="true">🎉</span>
        모두 완성했어요!
      </div>

      <button class="reset-btn" type="button" id="resetBtn" aria-label="순서 체크 지우기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        다시 하기
      </button>
    `;

    recipeEl.hidden = false;
    menuEl.hidden = true;

    recipeEl.querySelector('#backBtn').addEventListener('click', closeRecipe);

    const steps = recipeEl.querySelectorAll('.step');
    steps.forEach(st => {
      const toggle = () => {
        const idx = +st.dataset.idx;
        checked[idx] = !checked[idx];
        st.setAttribute('aria-checked', checked[idx] ? 'true' : 'false');
        progress[key] = checked;
        saveProgress();
        updateDone();
      };
      st.addEventListener('click', toggle);
      st.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
      });
    });

    recipeEl.querySelector('#resetBtn').addEventListener('click', () => {
      for (const k of Object.keys(checked)) delete checked[k];
      progress[key] = checked;
      saveProgress();
      steps.forEach(st => st.setAttribute('aria-checked', 'false'));
      updateDone();
    });

    updateDone();
    window.scrollTo({ top: 0, behavior: 'smooth' });

    function updateDone() {
      const total = b.steps.length;
      const done = b.steps.every((_, i) => checked[i]);
      const banner = recipeEl.querySelector('#doneBanner');
      if (banner) banner.classList.toggle('show', done && total > 0);
    }
  }

  function closeRecipe() {
    currentBev = null;
    recipeEl.hidden = true;
    menuEl.hidden = false;
  }

  // Theme toggle
  function applyTheme(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('bev_theme', t); } catch (e) {}
  }
  let theme = 'auto';
  try { theme = localStorage.getItem('bev_theme') || 'auto'; } catch (e) {}
  applyTheme(theme);
  themeTog.addEventListener('click', () => {
    const curr = document.documentElement.getAttribute('data-theme');
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = curr === 'dark' || (!curr && sysDark);
    applyTheme(isDark ? 'light' : 'dark');
  });

  setCatVars(document.documentElement, currentCat);
  renderTabs();
  renderMenu();
</script>
