<title>음료 조제 학습지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">

<style>
  /* layout: tabs → menu grid → split recipe view (left: large growing drink picture; right: ingredients + numbered steps) → modal for add/edit */

  :root {
    --bg: #F2EDE2;
    --surface: #FFFFFF;
    --surface-2: #FAF4E7;
    --ink: #2A231D;
    --ink-soft: #6E6155;
    --ink-faint: #A69A8C;
    --line: #DED1BD;
    --line-soft: #EEE4D1;
    --accent: #7D4F2E;
    --focus: #D97757;
    --danger: #C25450;
    --shadow: 0 2px 0 rgba(0,0,0,.04), 0 8px 24px rgba(79,52,25,.08);
    --shadow-lift: 0 4px 0 rgba(0,0,0,.04), 0 12px 32px rgba(79,52,25,.14);
    --shadow-modal: 0 20px 60px rgba(0,0,0,.3);

    --coffee: #6B4226;
    --coffee-tint: #F2E3CF;
    --tea: #3B7A4F;
    --tea-tint: #DBECDF;
    --ade: #D88A1C;
    --ade-tint: #FBE9C3;
    --smoothie: #BE4876;
    --smoothie-tint: #F8D7E2;

    --radius: 18px;
    --radius-sm: 10px;
    --radius-lg: 28px;
    --font-display: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;

    --cat-color: var(--coffee);
    --cat-tint: var(--coffee-tint);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1813;
      --surface: #2A241D;
      --surface-2: #342C24;
      --ink: #F6EFE3;
      --ink-soft: #BDB1A1;
      --ink-faint: #85796C;
      --line: #4A3E31;
      --line-soft: #3A3127;
      --accent: #E3B07C;
      --focus: #EBA07F;
      --danger: #E8807B;
      --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lift: 0 4px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.5);
      --shadow-modal: 0 20px 60px rgba(0,0,0,.6);

      --coffee: #D9A878;
      --coffee-tint: #3A2A1E;
      --tea: #8DC66E;
      --tea-tint: #253324;
      --ade: #F2B44D;
      --ade-tint: #3B2E1A;
      --smoothie: #ED92B0;
      --smoothie-tint: #3C2531;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1813;
    --surface: #2A241D;
    --surface-2: #342C24;
    --ink: #F6EFE3;
    --ink-soft: #BDB1A1;
    --ink-faint: #85796C;
    --line: #4A3E31;
    --line-soft: #3A3127;
    --accent: #E3B07C;
    --focus: #EBA07F;
    --danger: #E8807B;
    --shadow: 0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    --shadow-lift: 0 4px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.5);
    --shadow-modal: 0 20px 60px rgba(0,0,0,.6);
    --coffee: #D9A878;
    --coffee-tint: #3A2A1E;
    --tea: #8DC66E;
    --tea-tint: #253324;
    --ade: #F2B44D;
    --ade-tint: #3B2E1A;
    --smoothie: #ED92B0;
    --smoothie-tint: #3C2531;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { font-family: var(--font-body); color: var(--ink); background: var(--bg); }
  body {
    margin: 0;
    font-weight: 500;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding-block: 20px 100px; }

  header.top { text-align: center; padding: 20px 8px 18px; margin-bottom: 18px; }
  header.top::after {
    content: ""; display: block; width: 60%; height: 0;
    border-bottom: 3px dashed var(--line); margin: 18px auto 0;
  }
  header.top h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 5.4vw, 46px);
    margin: 0 0 6px; color: var(--accent); letter-spacing: -0.5px;
  }
  header.top p { margin: 0; color: var(--ink-soft); font-size: clamp(14px, 2.5vw, 17px); font-weight: 700; }
  header.top .decor { display: inline-flex; gap: 10px; font-size: 22px; margin-bottom: 6px; opacity: 0.8; }

  /* Category tabs */
  nav.tabs {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 4px 2px 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 1 0 auto; min-width: 112px; padding: 14px 18px;
    border: 2.5px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink);
    font-family: var(--font-display); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .15s, background .2s, border-color .2s, color .2s;
  }
  .tab:hover { transform: translateY(-2px); border-color: var(--tab-color); }
  .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .tab[aria-selected="true"] { background: var(--tab-color); border-color: var(--tab-color); color: #fff; }
  .tab .emoji { font-size: 24px; line-height: 1; }

  /* Menu grid */
  .menu {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px; margin-top: 20px;
  }
  .menu[hidden] { display: none; }
  .card {
    background: var(--surface); border: 2.5px solid var(--line);
    border-radius: var(--radius); padding: 16px 14px 18px;
    text-align: center; cursor: pointer;
    transition: transform .15s, box-shadow .2s, border-color .2s;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-width: 0; font: inherit; color: inherit; position: relative;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); border-color: var(--cat-color); }
  .card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .card .thumb {
    width: 110px; height: 110px; display: grid; place-items: center;
    border-radius: 50%; background: var(--cat-tint); color: var(--cat-color);
  }
  .card .thumb svg { width: 92px; height: 92px; display: block; }
  .card h3 { font-family: var(--font-display); font-size: 20px; margin: 0; color: var(--ink); letter-spacing: -0.3px; }
  .card .sub { font-size: 11.5px; color: var(--ink-faint); font-weight: 500; letter-spacing: 0.2px; }
  .card .card-edit {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--line);
    display: none; place-items: center; cursor: pointer;
    color: var(--ink-soft); padding: 0;
  }
  .card .card-edit:hover { background: var(--cat-tint); color: var(--cat-color); border-color: var(--cat-color); }
  body.edit-mode .card .card-edit { display: grid; }
  body.edit-mode .card { padding-top: 44px; }

  /* Add-menu placeholder card */
  .card-add {
    background: transparent; border: 3px dashed var(--line);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; min-height: 180px; cursor: pointer;
    color: var(--ink-soft); font: inherit;
    border-radius: var(--radius); padding: 20px;
    transition: border-color .2s, background .2s, color .2s;
  }
  .card-add:hover { border-color: var(--cat-color); background: var(--cat-tint); color: var(--cat-color); }
  .card-add:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .card-add .plus {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--surface); border: 3px dashed var(--line);
    display: grid; place-items: center;
    font-size: 32px; font-family: var(--font-display); line-height: 1;
    color: var(--cat-color);
  }
  .card-add .add-label { font-family: var(--font-display); font-size: 17px; }
  body.edit-mode .card-add { display: flex; }

  /* Recipe view */
  .recipe {
    background: var(--surface); border: 2.5px solid var(--line);
    border-radius: var(--radius-lg); padding: 22px;
    box-shadow: var(--shadow); margin-top: 10px;
  }
  .recipe[hidden] { display: none; }
  .recipe-head {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 18px; border-bottom: 3px dashed var(--line); margin-bottom: 20px;
  }
  .back-btn {
    width: 48px; height: 48px; display: grid; place-items: center;
    border-radius: 50%; background: var(--surface-2); border: 2.5px solid var(--line);
    color: var(--ink); font-size: 24px; cursor: pointer; flex-shrink: 0;
    font-family: var(--font-display); line-height: 1; padding: 0;
  }
  .back-btn:hover { background: var(--line-soft); }
  .back-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .recipe-title { flex: 1; min-width: 0; }
  .recipe-title .cat-label {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--cat-tint); color: var(--cat-color);
    padding: 4px 10px; border-radius: 12px;
    font-size: 13px; font-weight: 900; margin-bottom: 6px;
  }
  .recipe-title h2 {
    font-family: var(--font-display); font-size: clamp(26px, 4.5vw, 36px);
    margin: 0; color: var(--ink); letter-spacing: -0.3px;
  }
  .edit-menu-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 14px; background: var(--cat-tint); color: var(--cat-color);
    border: 2px solid var(--cat-color); border-radius: 12px;
    font-family: var(--font-display); font-size: 14px; cursor: pointer;
  }
  .edit-menu-btn:hover { background: var(--cat-color); color: #fff; }

  .section-title {
    font-family: var(--font-display); font-size: 24px; color: var(--ink);
    margin: 24px 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ""; width: 8px; height: 26px; background: var(--cat-color); border-radius: 4px;
  }

  /* Ingredients */
  .ingredients {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
  .ing {
    background: var(--surface-2); border: 2.5px solid var(--line);
    border-radius: var(--radius); padding: 16px 10px 14px;
    text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 8px; min-width: 0; color: var(--cat-color);
  }
  .ing .vis { width: 130px; height: 130px; display: grid; place-items: center; }
  .ing .vis svg { width: 100%; height: 100%; display: block; }
  .ing .ing-name { font-family: var(--font-display); font-size: 18px; color: var(--ink); }
  .ing .ing-amt {
    display: inline-block; background: var(--surface); color: var(--cat-color);
    padding: 4px 14px; border-radius: 10px; font-size: 16px; font-weight: 900;
    border: 2px solid var(--cat-color); font-family: var(--font-display);
  }

  /* Split recipe layout: picture left, steps right */
  .recipe-split {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 22px; align-items: start; margin-top: 10px;
  }
  @media (max-width: 820px) {
    .recipe-split { grid-template-columns: 1fr; gap: 16px; }
  }

  .drink-stage {
    background: var(--surface-2); border: 2.5px solid var(--line);
    border-radius: var(--radius); padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    position: sticky; top: 20px;
    color: var(--ink);
  }
  @media (max-width: 820px) { .drink-stage { position: static; } }
  .drink-stage .drink-svg {
    width: 100%; max-width: 360px; aspect-ratio: 3/4;
    display: grid; place-items: center;
  }
  .drink-stage .drink-svg svg { width: 100%; height: 100%; display: block; color: var(--ink); }
  .drink-caption {
    margin-top: 14px; font-family: var(--font-display);
    font-size: 18px; color: var(--cat-color); text-align: center;
  }
  .drink-caption .fraction { font-size: 22px; }

  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface-2); border: 2.5px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    cursor: pointer; transition: background .2s, border-color .2s, opacity .2s;
    user-select: none; text-align: left; font: inherit; color: inherit; width: 100%;
  }
  .step:hover { background: var(--line-soft); border-color: var(--cat-color); }
  .step:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .step[aria-checked="true"] { background: var(--cat-tint); border-color: var(--cat-color); opacity: 0.78; }
  .step[aria-checked="true"] .step-text {
    text-decoration: line-through; text-decoration-color: var(--cat-color); text-decoration-thickness: 2px;
  }
  .step .num {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--cat-color); color: #fff;
    font-family: var(--font-display); font-size: 22px; flex-shrink: 0; line-height: 1;
  }
  .step .step-icon {
    width: 60px; height: 60px; display: grid; place-items: center;
    background: var(--surface); border-radius: 50%; border: 2.5px solid var(--line);
    color: var(--cat-color); flex-shrink: 0;
  }
  .step .step-icon svg { width: 38px; height: 38px; display: block; }
  .step .step-text {
    flex: 1; font-size: 18px; font-weight: 700; color: var(--ink);
    line-height: 1.4; min-width: 0; word-break: keep-all;
  }
  .step .step-check {
    width: 40px; height: 40px; border: 3px solid var(--line); border-radius: 50%;
    background: var(--surface); display: grid; place-items: center;
    flex-shrink: 0; position: relative;
  }
  .step[aria-checked="true"] .step-check { background: var(--cat-color); border-color: var(--cat-color); }
  .step[aria-checked="true"] .step-check::after {
    content: ""; position: absolute; width: 18px; height: 10px;
    border-left: 4px solid #fff; border-bottom: 4px solid #fff;
    transform: rotate(-45deg) translate(1px, -2px); left: 7px; top: 11px;
  }

  /* Done banner */
  .done-banner {
    display: none; text-align: center; padding: 22px 18px; margin-top: 20px;
    background: linear-gradient(135deg, var(--cat-tint) 0%, var(--surface-2) 100%);
    border: 3px dashed var(--cat-color); border-radius: var(--radius);
    font-family: var(--font-display); font-size: clamp(22px, 4vw, 28px);
    color: var(--cat-color); animation: pop .4s ease-out; letter-spacing: -0.3px;
  }
  .done-banner.show { display: block; }
  .done-banner .big { font-size: 48px; display: block; margin-bottom: 8px; line-height: 1; }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .done-banner { animation: none; }
    .card, .step, .tab { transition: none; }
  }

  .reset-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 18px;
    padding: 10px 16px; background: var(--surface-2); border: 2px solid var(--line);
    border-radius: 12px; font-family: var(--font-display); font-size: 15px;
    color: var(--ink-soft); cursor: pointer;
  }
  .reset-btn:hover { background: var(--line-soft); color: var(--ink); }
  .reset-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,15,10,.5);
    z-index: 50; backdrop-filter: blur(2px);
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    position: fixed; inset: 20px;
    max-width: 720px; margin: auto; max-height: calc(100vh - 40px);
    background: var(--surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-modal);
    z-index: 51; display: flex; flex-direction: column;
    border: 2.5px solid var(--line);
  }
  .modal[hidden] { display: none; }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 2.5px dashed var(--line);
    flex-shrink: 0;
  }
  .modal-head h2 {
    font-family: var(--font-display); font-size: 24px;
    margin: 0; color: var(--ink); letter-spacing: -0.3px;
  }
  .modal-close {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-2); border: 2px solid var(--line);
    display: grid; place-items: center; font-family: var(--font-display);
    font-size: 20px; cursor: pointer; color: var(--ink); padding: 0; line-height: 1;
  }
  .modal-close:hover { background: var(--line-soft); }
  .modal-body {
    flex: 1; overflow-y: auto; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .modal-foot {
    padding: 16px 22px; border-top: 2.5px dashed var(--line); flex-shrink: 0;
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
  }
  @media (max-width: 500px) {
    .modal { inset: 0; max-height: 100vh; border-radius: 0; border: 0; }
    .modal-foot { position: sticky; bottom: 0; background: var(--surface); }
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label {
    font-family: var(--font-display); font-size: 15px; color: var(--ink);
  }
  .field input[type="text"] {
    width: 100%; padding: 10px 12px; border: 2px solid var(--line);
    border-radius: 10px; font: inherit; font-weight: 500;
    background: var(--surface); color: var(--ink);
  }
  .field input[type="text"]:focus { outline: none; border-color: var(--cat-color); }

  .cat-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-picker label {
    cursor: pointer; padding: 10px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface);
    font-family: var(--font-display); font-size: 15px; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .cat-picker input { position: absolute; opacity: 0; pointer-events: none; }
  .cat-picker label:has(input:checked) { background: var(--pc-color); color: #fff; border-color: var(--pc-color); }

  .sub-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px;
  }
  .sub-head h3 {
    font-family: var(--font-display); font-size: 18px; margin: 0; color: var(--ink);
  }
  .btn-add {
    padding: 8px 14px; background: var(--surface-2); border: 2px solid var(--line);
    border-radius: 10px; font-family: var(--font-display); font-size: 14px;
    cursor: pointer; color: var(--ink);
  }
  .btn-add:hover { background: var(--cat-tint); color: var(--cat-color); border-color: var(--cat-color); }

  .edit-list { display: flex; flex-direction: column; gap: 10px; }
  .edit-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 2px solid var(--line);
    border-radius: 12px; padding: 10px;
    min-width: 0;
  }
  .edit-row .er-vis {
    width: 56px; height: 56px; display: grid; place-items: center;
    background: var(--surface); border-radius: 10px; flex-shrink: 0;
    color: var(--cat-color); position: relative;
    border: 2px solid transparent; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .edit-row .er-vis:hover { background: var(--cat-tint); border-color: var(--cat-color); }
  .edit-row .er-vis[data-replace-ing]::after,
  .edit-row .er-vis[data-replace-step]::after {
    content: "✎"; position: absolute; right: -5px; bottom: -5px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--cat-color); color: #fff;
    font-size: 12px; display: grid; place-items: center;
    border: 2px solid var(--surface); font-family: var(--font-display);
    line-height: 1;
  }
  .edit-row .er-vis.replacing { border-color: var(--cat-color); background: var(--cat-tint); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--cat-color); } 50% { box-shadow: 0 0 0 4px rgba(0,0,0,0); } }
  .edit-row .er-vis svg { width: 48px; height: 48px; display: block; }
  .edit-row .er-fields { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .edit-row .er-fields input {
    width: 100%; padding: 6px 10px; border: 1.5px solid var(--line);
    border-radius: 8px; font: inherit; font-size: 14px; font-weight: 700;
    background: var(--surface); color: var(--ink); min-width: 0;
  }
  .edit-row .er-fields input:focus { outline: none; border-color: var(--cat-color); }
  .edit-row .er-del {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--surface); border: 2px solid var(--line);
    color: var(--danger); display: grid; place-items: center;
    cursor: pointer; font-size: 18px; line-height: 1; padding: 0;
  }
  .edit-row .er-del:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .edit-row .er-num {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--cat-color); color: #fff;
    font-family: var(--font-display); font-size: 16px;
    display: grid; place-items: center; flex-shrink: 0;
  }

  .picker {

<script>
  /* ============ Utility ============ */
  let _svgId = 0;
  const uid = () => `s${++_svgId}`;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  /* ============ Small ingredient pictograms ============ */

  function cup(level, fluid, label) {
    const id = uid();
    const w = 100, h = 110, topY = 15, botY = 95;
    const leftTop = 24, rightTop = 76, leftBot = 32, rightBot = 68;
    const fillY = topY + (botY - topY) * (1 - level);
    const marks = [0.25, 0.5, 0.75];
    return `
      <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><clipPath id="${id}">
          <path d="M${leftTop} ${topY} L${rightTop} ${topY} L${rightBot} ${botY} Q${rightBot+2} ${botY+4} ${rightBot-4} ${botY+4} L${leftBot+4} ${botY+4} Q${leftBot-2} ${botY+4} ${leftBot} ${botY} Z"/>
        </clipPath></defs>
        <g clip-path="url(#${id})"><rect x="0" y="${fillY}" width="${w}" height="${h}" fill="${fluid}"/></g>
        <path d="M${leftTop} ${topY} L${rightTop} ${topY} L${rightBot} ${botY} Q${rightBot+2} ${botY+4} ${rightBot-4} ${botY+4} L${leftBot+4} ${botY+4} Q${leftBot-2} ${botY+4} ${leftBot} ${botY} Z"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="50" cy="${topY}" rx="26" ry="3.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
        ${marks.map(m => {
          const y = topY + (botY - topY) * (1 - m);
          const t = (y - topY) / (botY - topY);
          const lx = leftTop + (leftBot - leftTop) * t;
          return `<line x1="${lx+1}" y1="${y}" x2="${lx+8}" y2="${y}" stroke="currentColor" stroke-width="1.8" opacity="0.45"/>`;
        }).join('')}
        <rect x="54" y="${fillY-12}" width="38" height="24" rx="6" fill="currentColor"/>
        <text x="73" y="${fillY+6}" font-family="Jua, sans-serif" font-size="20" fill="var(--surface)" text-anchor="middle" font-weight="900">${esc(label)}</text>
      </svg>
    `;
  }

  function iceCup(level, label) {
    const id = uid();
    const w = 100, h = 110, topY = 15, botY = 95;
    const leftTop = 24, rightTop = 76, leftBot = 32, rightBot = 68;
    const fillY = topY + (botY - topY) * (1 - level);
    const cubes = [
      { x: 38, y: botY - 18, s: 14, r: 8 },
      { x: 54, y: botY - 30, s: 13, r: -10 },
      { x: 36, y: botY - 42, s: 13, r: 6 },
      { x: 52, y: botY - 54, s: 12, r: -8 },
      { x: 40, y: botY - 65, s: 12, r: 14 },
      { x: 55, y: botY - 76, s: 11, r: -6 },
    ];
    const vis = cubes.filter(c => c.y >= fillY - 4);
    return `
      <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><clipPath id="${id}"><path d="M${leftTop} ${topY} L${rightTop} ${topY} L${rightBot} ${botY} Q${rightBot+2} ${botY+4} ${rightBot-4} ${botY+4} L${leftBot+4} ${botY+4} Q${leftBot-2} ${botY+4} ${leftBot} ${botY} Z"/></clipPath></defs>
        <g clip-path="url(#${id})">
          ${vis.map(c => `
            <rect x="${c.x}" y="${c.y}" width="${c.s}" height="${c.s}" rx="2.5"
                  fill="#D4EBF4" stroke="#6FA3BA" stroke-width="1.6"
                  transform="rotate(${c.r} ${c.x+c.s/2} ${c.y+c.s/2})"/>
            <path d="M${c.x+2} ${c.y+c.s*0.35} L${c.x+c.s*0.4} ${c.y+2}" stroke="#fff" stroke-width="1.6" opacity="0.7"
                  transform="rotate(${c.r} ${c.x+c.s/2} ${c.y+c.s/2})"/>
          `).join('')}
        </g>
        <path d="M${leftTop} ${topY} L${rightTop} ${topY} L${rightBot} ${botY} Q${rightBot+2} ${botY+4} ${rightBot-4} ${botY+4} L${leftBot+4} ${botY+4} Q${leftBot-2} ${botY+4} ${leftBot} ${botY} Z"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="50" cy="${topY}" rx="26" ry="3.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <rect x="54" y="${fillY-12}" width="38" height="24" rx="6" fill="currentColor"/>
        <text x="73" y="${fillY+6}" font-family="Jua, sans-serif" font-size="20" fill="var(--surface)" text-anchor="middle" font-weight="900">${esc(label)}</text>
      </svg>
    `;
  }

  function shot(count) {
    return `
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M30 32 L70 32 L62 78 Q62 82 58 82 L42 82 Q38 82 38 78 Z"
              fill="var(--surface)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M31.5 44 L68.5 44 L62 78 Q62 82 58 82 L42 82 Q38 82 38 78 Z" fill="#4A2A14"/>
        <ellipse cx="50" cy="44" rx="18" ry="2.4" fill="#9A6A3F" opacity="0.75"/>
        <path d="M70 52 Q84 52 84 64 Q84 72 72 72" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="80" cy="24" r="15" fill="currentColor"/>
        <text x="80" y="31" font-family="Jua, sans-serif" font-size="20" fill="var(--surface)" text-anchor="middle" font-weight="900">×${count}</text>
      </svg>
    `;
  }

  function pump(count, bottleColor) {
    bottleColor = bottleColor || '#B46A2E';
    return `
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="30" y="40" width="40" height="48" rx="5" fill="${bottleColor}" stroke="currentColor" stroke-width="2.5"/>
        <rect x="34" y="54" width="32" height="18" rx="2" fill="var(--surface)" opacity="0.85"/>
        <rect x="36" y="30" width="28" height="12" rx="2" fill="var(--surface)" stroke="currentColor" stroke-width="2.5"/>
        <path d="M50 30 L50 18 L62 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="62" cy="18" r="5" fill="currentColor"/>
        <circle cx="80" cy="26" r="15" fill="currentColor"/>
        <text x="80" y="33" font-family="Jua, sans-serif" font-size="20" fill="var(--surface)" text-anchor="middle" font-weight="900">×${count}</text>
      </svg>
    `;
  }

  function scoop(count, fillColor) {
    fillColor = fillColor || '#E8DCB8';
    return `
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22 58 Q22 76 40 76 L52 76 Q70 76 70 58 Q70 48 52 48 L40 48 Q22 48 22 58 Z"
              fill="var(--surface)" stroke="currentColor" stroke-width="2.5"/>
        <path d="M25 58 Q25 72 40 72 L52 72 Q67 72 67 58 L25 58 Z" fill="${fillColor}" opacity="0.9"/>
        <path d="M26 48 Q36 32 46 42 Q56 32 66 48" fill="${fillColor}" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>

  function warnChipHTML(step) {
    if (!step || !step.warn) return '';

  /* ============ Big drink picture (grows with checked steps) ============ */

  function hexToRgb(hex) {
    hex = (hex || '#CCCCCC').replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(r, g, b) {
    const h = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(b);
  }
  function averageColors(layers) {
    if (!layers || layers.length === 0) return '#CCCCCC';
    const total = layers.reduce((s, l) => s + (l.amount || 0), 0);
    if (total === 0) return layers[0].color;
    let r = 0, g = 0, b = 0;
    for (const l of layers) {
      const [lr, lg, lb] = hexToRgb(l.color);
      const w = (l.amount || 0) / total;
      r += lr * w; g += lg * w; b += lb * w;
    }
    return rgbToHex(r, g, b);
  }

  const ICE_CUBES = [

  const BLEND_SPECKS = [
    [90, 320], [120, 300], [150, 280], [180, 260], [100, 240],
    [160, 220], [190, 200], [120, 190], [140, 160], [170, 150],
    [110, 130], [150, 100], [180, 80], [130, 70], [165, 180],
    [100, 290], [175, 240], [125, 215], [155, 325], [195, 155],
  ];

  function buildDrinkState(steps, checked) {
    const state = {
      started: false, ice: 0, layers: [], mixed: false,
      blended: false, teabag: false, done: false, lemon: false, hot: false,
    };
    (steps || []).forEach((s, i) => {
      if (!checked[i]) return;
      switch (s.do) {
        case 'init': state.started = true; break;
        case 'ice': state.ice = Math.max(state.ice, s.level || 0); break;
        case 'pour':
          state.layers.push({ color: s.color || '#CCCCCC', amount: s.amount || 0.1 });
          if (s.hot) state.hot = true;
          break;
        case 'teabag': state.teabag = true; break;
        case 'remove-teabag': state.teabag = false; break;
        case 'mix': state.mixed = true; break;
        case 'blend': state.blended = true; state.mixed = true; break;
        case 'lemon': state.lemon = true; break;
        case 'done': state.done = true; break;
      }
    });
    if (!state.started) state.started = (checked && Object.values(checked).some(Boolean));
    return state;
  }

  function renderBigDrink(state, shape) {
    shape = shape || 'glass';
    if (shape === 'mug') return renderBigDrinkMug(state);
    const w = 300, h = 400, topY = 30, botY = 350;
    const topX1 = 50, topX2 = 250, botX1 = 85, botX2 = 215;
    const glassPath = `M${topX1} ${topY} L${topX2} ${topY} L${botX2} ${botY} Q${botX2+5} ${botY+10} ${botX2-8} ${botY+10} L${botX1+8} ${botY+10} Q${botX1-5} ${botY+10} ${botX1} ${botY} Z`;
    const cid = uid();
    const parts = [];
    parts.push(`<defs><clipPath id="${cid}"><path d="${glassPath}"/></clipPath></defs>`);

    const liquidTotal = state.layers.reduce((s, l) => s + l.amount, 0);
    const liquidLevel = Math.min(0.98, liquidTotal);
    const liquidY = botY - liquidLevel * (botY - topY);

    if (state.hot) {
      parts.push(`<g opacity="0.45" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">`);
      [[115, 22], [150, 18], [185, 22]].forEach(([x, y]) => {
        parts.push(`<path d="M${x} ${y} Q${x-10} ${y-18} ${x} ${y-36} Q${x+10} ${y-54} ${x} ${y-72}"/>`);
      });
      parts.push(`</g>`);
    }

    if (state.lemon) {
      parts.push(`<g transform="translate(${topX2-15} ${topY-6})">
        <circle cx="0" cy="0" r="26" fill="#F6D74A" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="18" fill="#FDEC9A" stroke="currentColor" stroke-width="1.8"/>
        <path d="M-16 0 L16 0 M0 -16 L0 16" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
      </g>`);
    }

    if (state.started) {
      parts.push(`<g clip-path="url(#${cid})">`);
      if (state.layers.length > 0) {
        if (state.mixed) {
          const color = averageColors(state.layers);
          parts.push(`<rect x="0" y="${liquidY}" width="${w}" height="${h}" fill="${color}"/>`);
        } else {
          let y = botY;
          const maxY = topY + 2;
          for (let i = 0; i < state.layers.length; i++) {
            const lay = state.layers[i];
            const layerH = lay.amount * (botY - topY);
            const nextY = Math.max(maxY, y - layerH);
            parts.push(`<rect x="0" y="${nextY}" width="${w}" height="${y - nextY}" fill="${lay.color}"/>`);
            y = nextY;
            if (y <= maxY) break;
          }
        }
        if (state.blended) {
          BLEND_SPECKS.forEach(([x, y]) => {
            if (y > liquidY) parts.push(`<circle cx="${x}" cy="${y}" r="2.5" fill="rgba(255,255,255,0.4)"/>`);
          });
        }
      }
      if (state.ice > 0) {
        const iceTopY = botY - state.ice * (botY - topY);
        ICE_CUBES.filter(c => c.y + c.s > iceTopY).forEach(c => {
          parts.push(`<rect x="${c.x}" y="${c.y}" width="${c.s}" height="${c.s}" rx="3" fill="#D4EBF4" stroke="#6FA3BA" stroke-width="2" transform="rotate(${c.r} ${c.x+c.s/2} ${c.y+c.s/2})"/>`);
          parts.push(`<path d="M${c.x+3} ${c.y+c.s*0.4} L${c.x+c.s*0.4} ${c.y+3}" stroke="#fff" stroke-width="2" opacity="0.7" transform="rotate(${c.r} ${c.x+c.s/2} ${c.y+c.s/2})"/>`);
        });
      }
      if (state.teabag) {
        const bagTop = Math.max(liquidY + 10, topY + 60);
        parts.push(`<path d="M150 ${topY} L150 ${bagTop}" stroke="#8B7355" stroke-width="2.5" fill="none"/>`);
        parts.push(`<rect x="138" y="${bagTop}" width="24" height="14" rx="2" fill="var(--surface)" stroke="currentColor" stroke-width="2.5"/>`);
        parts.push(`<text x="150" y="${bagTop+10}" text-anchor="middle" font-size="8" font-family="Jua" fill="currentColor" font-weight="900">TEA</text>`);
        parts.push(`<path d="M128 ${bagTop+16} L172 ${bagTop+16} L166 ${bagTop+52} Q166 ${bagTop+56} 162 ${bagTop+56} L138 ${bagTop+56} Q134 ${bagTop+56} 134 ${bagTop+52} Z" fill="#D9BD86" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>`);
        parts.push(`<line x1="140" y1="${bagTop+28}" x2="160" y2="${bagTop+28}" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>`);
        parts.push(`<line x1="140" y1="${bagTop+42}" x2="160" y2="${bagTop+42}" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>`);
      }
      parts.push(`</g>`);
    }

    parts.push(`<path d="${glassPath}" fill="none" stroke="currentColor" stroke-width="${state.started ? 3.5 : 2.5}" stroke-linejoin="round" ${state.started ? '' : 'stroke-dasharray="6 6" opacity="0.5"'}/>`);
    parts.push(`<ellipse cx="150" cy="${topY}" rx="100" ry="7" fill="none" stroke="currentColor" stroke-width="${state.started ? 3.5 : 2.5}" ${state.started ? '' : 'stroke-dasharray="6 6" opacity="0.5"'}/>`);

    if (state.done) {
      parts.push(`<path d="M172 10 L208 ${botY-10}" stroke="#E05A6E" stroke-width="11" stroke-linecap="round"/>`);
      parts.push(`<path d="M172 10 L208 ${botY-10}" stroke="#FFF" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="9 12" opacity="0.65"/>`);
    }

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
  }

  function renderBigDrinkMug(state) {
    const w = 300, h = 400;
    const topY = 95, botY = 350;
    const bodyL = 65, bodyR = 215;
    const mugPath = `M${bodyL} ${topY} L${bodyR} ${topY} L${bodyR} ${botY-20} Q${bodyR} ${botY} ${bodyR-20} ${botY} L${bodyL+20} ${botY} Q${bodyL} ${botY} ${bodyL} ${botY-20} Z`;
    const handlePath = `M${bodyR} ${topY+45} C${bodyR+72} ${topY+55} ${bodyR+72} ${topY+170} ${bodyR} ${topY+180}`;
    const cid = uid();
    const parts = [];
    parts.push(`<defs><clipPath id="${cid}"><path d="${mugPath}"/></clipPath></defs>`);

    const liquidTotal = state.layers.reduce((s, l) => s + l.amount, 0);
    const liquidLevel = Math.min(0.95, liquidTotal);
    const liquidY = topY + 10 + (botY - topY - 10) * (1 - liquidLevel);

    if (state.hot && state.started) {
      parts.push(`<g opacity="0.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">`);
      [[110, 82], [140, 72], [170, 82]].forEach(([x, y]) => {
        parts.push(`<path d="M${x} ${y} Q${x-12} ${y-22} ${x} ${y-44} Q${x+12} ${y-66} ${x} ${y-82}"/>`);

      parts.push(`</g>`);
    }

    if (state.started) {
      parts.push(`<path d="${handlePath}" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>`);
      parts.push(`<path d="${handlePath}" fill="none" stroke="var(--surface-2)" stroke-width="7" stroke-linecap="round"/>`);
    } else {
      parts.push(`<path d="${handlePath}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.5"/>`);
    }

    if (state.started) {
      parts.push(`<g clip-path="url(#${cid})">`);
      if (state.layers.length > 0) {
        if (state.mixed) {
          const color = averageColors(state.layers);
          parts.push(`<rect x="0" y="${liquidY}" width="${w}" height="${h}" fill="${color}"/>`);
        } else {
          let y = botY;
          const maxY = topY + 15;
          for (let i = 0; i < state.layers.length; i++) {
            const lay = state.layers[i];
            const layerH = lay.amount * (botY - topY - 15);
            const nextY = Math.max(maxY, y - layerH);
            parts.push(`<rect x="0" y="${nextY}" width="${w}" height="${y - nextY}" fill="${lay.color}"/>`);
            y = nextY;
            if (y <= maxY) break;
          }
        }
      }
      if (state.teabag) {
        const bagTop = Math.max(liquidY + 10, topY + 60);
        parts.push(`<path d="M140 ${topY+2} L140 ${bagTop}" stroke="#8B7355" stroke-width="2.5" fill="none"/>`);
        parts.push(`<rect x="128" y="${bagTop}" width="24" height="14" rx="2" fill="var(--surface)" stroke="currentColor" stroke-width="2.5"/>`);
        parts.push(`<text x="140" y="${bagTop+10}" text-anchor="middle" font-size="8" font-family="Jua" fill="currentColor" font-weight="900">TEA</text>`);
        parts.push(`<path d="M118 ${bagTop+16} L162 ${bagTop+16} L156 ${bagTop+52} Q156 ${bagTop+56} 152 ${bagTop+56} L128 ${bagTop+56} Q124 ${bagTop+56} 124 ${bagTop+52} Z" fill="#D9BD86" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>`);
      }
      parts.push(`</g>`);
    }

    parts.push(`<path d="${mugPath}" fill="none" stroke="currentColor" stroke-width="${state.started ? 3.5 : 2.5}" stroke-linejoin="round" ${state.started ? '' : 'stroke-dasharray="6 6" opacity="0.5"'}/>`);
    parts.push(`<ellipse cx="140" cy="${topY}" rx="75" ry="8" fill="var(--surface)" stroke="currentColor" stroke-width="${state.started ? 3.5 : 2.5}" ${state.started ? '' : 'stroke-dasharray="6 6" opacity="0.5"'}/>`);
    parts.push(`<ellipse cx="140" cy="${topY}" rx="68" ry="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>`);

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
  }

    { ic: 'stir',     t: '잘 저어요',            do: 'mix' },
    { ic: 'stir',     t: '빨대로 가볍게 저어요',  do: 'mix' },

    { ic: 'lemon',    t: '레몬 1조각을 올려요',   do: 'lemon' },
    { ic: 'done',     t: '완성!',               do: 'done' },
  ];

  /* ============ Storage ============ */
  const safeGet = (k, def) => {
    try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
  };
  const safeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  const loadCustom     = () => safeGet('bev_custom', []);
  const saveCustom     = (v) => safeSet('bev_custom', v);
  const loadOverrides  = () => safeGet('bev_overrides', {});
  const saveOverrides  = (v) => safeSet('bev_overrides', v);
  const loadDeleted    = () => safeGet('bev_deleted', []);
  const saveDeleted    = (v) => safeSet('bev_deleted', v);
  const loadProgress   = () => safeGet('bev_prog', {});
  const saveProgress   = (v) => safeSet('bev_prog', v);
  const loadEditMode   = () => safeGet('bev_editmode', false);
  const saveEditMode   = (v) => safeSet('bev_editmode', v);
  const loadTheme      = () => (localStorage.getItem('bev_theme') || 'auto');
  const saveTheme      = (v) => { try { localStorage.setItem('bev_theme', v); } catch (e) {} };

  function isDefaultMenu(cat, id) {
    return !!(DEFAULT_BEV[cat] && DEFAULT_BEV[cat].some(m => m.id === id));
  }

  function getEffectiveMenus(cat) {
    const defaults = (DEFAULT_BEV[cat] || []).map(m => ({ ...m, category: cat }));
    const overrides = loadOverrides();
    const custom = loadCustom().filter(m => m.category === cat);
    const deleted = loadDeleted();
    const defaultMenus = defaults
      .filter(m => !deleted.includes(`${cat}:${m.id}`))
      .map(m => {
        const ov = overrides[`${cat}:${m.id}`];
        return ov ? { ...m, ...ov, id: m.id, category: cat } : m;
      });
    return [...defaultMenus, ...custom];
  }

  /* ============ UI state ============ */
  const tabsEl = document.getElementById('tabs');
  const menuEl = document.getElementById('menu');
  const recipeEl = document.getElementById('recipe');
  const modalEl = document.getElementById('editModal');
  const modalBackdropEl = document.getElementById('modalBackdrop');
  const themeTog = document.getElementById('themeTog');
  const editTog = document.getElementById('editTog');

  let currentCat = 'coffee';
  let currentBev = null;
  let progress = loadProgress();
  let editingMenu = null;
  let editingKey = null;
  let editingIsNew = false;
  let ingPickerOpen = false;
  let stepPickerOpen = false;
  let replacingIngIdx = null;
  let replacingStepIdx = null;

  function setCatVars(target, cat) {
    const c = categories[cat];
    target.style.setProperty('--cat-color', c.color);
    target.style.setProperty('--cat-tint', c.tint);
  }

  /* ============ Tabs ============ */
  function renderTabs() {
    tabsEl.innerHTML = catOrder.map(k => {
      const c = categories[k];
      return `<button class="tab" type="button" role="tab" data-cat="${k}" aria-selected="${k === currentCat}" style="--tab-color:${c.color}"><span class="emoji" aria-hidden="true">${c.emoji}</span><span>${esc(c.label)}</span></button>`;
    }).join('');
    tabsEl.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        currentCat = t.dataset.cat;
        currentBev = null;
        setCatVars(document.documentElement, currentCat);
        renderTabs();
        renderMenu();
        recipeEl.hidden = true;
        const sp = document.getElementById('safetyPage');
        if (sp) sp.hidden = true;
        menuEl.hidden = false;
      });
    });
  }

  /* ============ Menu grid ============ */
  function renderMenu() {
    const items = getEffectiveMenus(currentCat);
    setCatVars(menuEl, currentCat);
    const cards = items.map(b => `
      <div class="card" data-id="${esc(b.id)}" role="button" tabindex="0" aria-label="${esc(b.name)} 레시피 열기">
        <button class="card-edit" type="button" aria-label="이 메뉴 편집" data-edit-id="${esc(b.id)}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <div class="thumb">${renderThumb(b.thumb || catDefaultThumb[currentCat])}</div>
        <h3>${esc(b.name)}</h3>
        <div class="sub">${esc(b.sub || '')}</div>
      </div>
    `).join('');
    const addCard = `
      <div class="card-add" id="addMenuCard" role="button" tabindex="0" aria-label="새 메뉴 추가">
        <div class="plus">+</div>
        <div class="add-label">메뉴 추가</div>
      </div>
    `;
    menuEl.innerHTML = cards + addCard;
    menuEl.querySelectorAll('.card').forEach(c => {
      const open = (e) => {
        if (e.target.closest('.card-edit')) return;
        openRecipe(c.dataset.id);
      };
      c.addEventListener('click', open);
      c.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); }
      });
    });
    menuEl.querySelectorAll('.card-edit').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openEditModal('edit', currentCat, btn.dataset.editId);
      });
    });
    const addCardEl = document.getElementById('addMenuCard');
    if (addCardEl) {
      const openAdd = () => openEditModal('add', currentCat);
      addCardEl.addEventListener('click', openAdd);
      addCardEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAdd(); }
      });
    }
  }

  /* ============ Recipe view ============ */
  function openRecipe(id) {
    const items = getEffectiveMenus(currentCat);
    const b = items.find(x => x.id === id);
    if (!b) return;
    currentBev = b;
    const key = `${currentCat}:${id}`;
    const checked = progress[key] || {};
    const col = categories[currentCat];
    setCatVars(recipeEl, currentCat);

    recipeEl.innerHTML = `
      <div class="recipe-head">
        <button class="back-btn" type="button" id="backBtn" aria-label="메뉴로 돌아가기">←</button>
        <div class="recipe-title">
          <span class="cat-label"><span aria-hidden="true">${col.emoji}</span> ${esc(col.label)}</span>
          <h2>${esc(b.name)}</h2>
        </div>
        <button class="edit-menu-btn" type="button" id="editMenuBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          편집
        </button>
      </div>

      <h3 class="section-title">준비물</h3>
      <div class="ingredients">
        ${b.ings.map(i => `
          <div class="ing">
            <div class="vis">${renderVisual(i.vis)}</div>
            <div class="ing-name">${esc(i.name)}</div>
            <div class="ing-amt">${esc(i.amt)}</div>
          </div>
        `).join('')}
      </div>

      <div class="recipe-split">
        <aside class="drink-stage">
          <div class="drink-svg" id="drinkStage"></div>
          <div class="drink-caption" id="drinkCaption"></div>
        </aside>
        <div>
          <h3 class="section-title">만드는 순서</h3>
          <div class="steps">
            ${b.steps.map((s, idx) => `
              <button class="step" type="button" role="checkbox" tabindex="0" data-idx="${idx}" aria-checked="${checked[idx] ? 'true' : 'false'}">
                <span class="num">${idx + 1}</span>
                <span class="step-icon" aria-hidden="true">${stepIcons[s.ic] || stepIcons.cup}</span>
                <span class="step-text">${esc(s.t)}</span>
                ${warnChipHTML(s)}

              </button>
            `).join('')}
          </div>
          <div class="done-banner" id="doneBanner">
            <span class="big" aria-hidden="true">🎉</span>
            모두 완성했어요!
          </div>
          <button class="reset-btn" type="button" id="resetBtn" aria-label="순서 체크 지우기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            다시 하기
          </button>
        </div>
      </div>
    `;

    recipeEl.hidden = false;
    menuEl.hidden = true;

    recipeEl.querySelector('#backBtn').addEventListener('click', closeRecipe);
    recipeEl.querySelector('#editMenuBtn').addEventListener('click', () => openEditModal('edit', currentCat, b.id));

    const steps = recipeEl.querySelectorAll('.step');
    steps.forEach(st => {
      const toggle = () => {
        const idx = +st.dataset.idx;
        checked[idx] = !checked[idx];
        st.setAttribute('aria-checked', checked[idx] ? 'true' : 'false');
        progress[key] = checked;
        saveProgress(progress);
        updateStage();
      };
      st.addEventListener('click', toggle);
      st.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
      });
    });

    recipeEl.querySelector('#resetBtn').addEventListener('click', () => {
      for (const k of Object.keys(checked)) delete checked[k];
      progress[key] = checked;
      saveProgress(progress);
      steps.forEach(st => st.setAttribute('aria-checked', 'false'));
      updateStage();
    });

    function updateStage() {
      const state = buildDrinkState(b.steps, checked);
      const stage = recipeEl.querySelector('#drinkStage');
      const caption = recipeEl.querySelector('#drinkCaption');
      const banner = recipeEl.querySelector('#doneBanner');
      if (stage) stage.innerHTML = renderBigDrink(state, b.shape || 'glass');
      const total = b.steps.length;
      const doneCount = b.steps.filter((_, i) => checked[i]).length;
      if (caption) {
        caption.innerHTML = `만든 순서 <span class="fraction">${doneCount} / ${total}</span>`;
      }
      const allDone = total > 0 && doneCount === total;
      if (banner) banner.classList.toggle('show', allDone);
    }

    updateStage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeRecipe() {
    currentBev = null;
    recipeEl.hidden = true;
    menuEl.hidden = false;
  }

  /* ============ Edit modal ============ */
  function openEditModal(mode, cat, id) {
    editingIsNew = mode === 'add';
    if (editingIsNew) {
      editingMenu = {
        id: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        category: cat,
        name: '',
        sub: '',
        thumb: { ...catDefaultThumb[cat] },
        ings: [],
        steps: [],
      };
      editingKey = null;
    } else {
      const items = getEffectiveMenus(cat);
      const found = items.find(m => m.id === id);
      if (!found) return;
      editingMenu = clone(found);
      editingMenu.category = cat;
      editingKey = `${cat}:${id}`;
    }
    ingPickerOpen = false;
    stepPickerOpen = false;
    renderModal();
    modalBackdropEl.hidden = false;
    modalEl.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    editingMenu = null;
    editingKey = null;
    ingPickerOpen = false;
    stepPickerOpen = false;
    replacingIngIdx = null;
    replacingStepIdx = null;
    modalBackdropEl.hidden = true;
    modalEl.hidden = true;
    document.body.style.overflow = '';
  }

  function renderModal() {
    const m = editingMenu;
    if (!m) return;
    const col = categories[m.category];
    modalEl.style.setProperty('--cat-color', col.color);
    modalEl.style.setProperty('--cat-tint', col.tint);

    const ingPickerHTML = ingPickerOpen ? `
      <div class="picker" id="ingPicker">
        <div class="picker-title">${replacingIngIdx !== null ? '🔄 아래 그림 중 하나를 눌러서 바꿔요 (이름·양은 유지됩니다)' : '아래 재료 그림을 눌러서 추가하세요'}</div>
        <div class="picker-grid">
          ${ING_GALLERY.map((g, idx) => `
            <button class="picker-item" type="button" data-ing-idx="${idx}">
              <span class="pi-vis">${renderVisual(g.vis)}</span>
              <span class="pi-lbl">${esc(g.name)}<br>${esc(g.amt)}</span>
            </button>
          `).join('')}
        </div>
      </div>` : '';
    const stepPickerHTML = stepPickerOpen ? `
      <div class="picker" id="stepPicker">
        <div class="picker-title">${replacingStepIdx !== null ? '🔄 아래 아이콘 중 하나를 눌러서 바꿔요 (단계 설명은 유지됩니다)' : '아래 단계를 눌러서 추가하세요 (텍스트는 추가 후 수정할 수 있어요)'}</div>
        <div class="picker-grid">
          ${STEP_PALETTE.map((s, idx) => `
            <button class="picker-item" type="button" data-step-idx="${idx}">
              <span class="pi-vis">${stepIcons[s.ic] || stepIcons.cup}</span>
              <span class="pi-lbl">${esc(s.t)}</span>
            </button>
          `).join('')}
        </div>
      </div>` : '';

    const canDelete = !editingIsNew;

    modalEl.innerHTML = `
      <div class="modal-head">
        <h2 id="modalTitle">${editingIsNew ? '새 메뉴 추가' : '메뉴 편집'}</h2>
        <button class="modal-close" type="button" aria-label="닫기" id="modalCloseBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="editName">메뉴 이름</label>
          <input type="text" id="editName" value="${esc(m.name)}" placeholder="예: 아이스초콜릿" maxlength="30">
        </div>

        <div class="field">
          <label>카테고리</label>
          <div class="cat-picker" id="catPicker">
            ${catOrder.map(k => {
              const c = categories[k];
              return `<label style="--pc-color:${c.color}"><input type="radio" name="editCat" value="${k}" ${k === m.category ? 'checked' : ''}><span><span aria-hidden="true">${c.emoji}</span> ${esc(c.label)}</span></label>`;
            }).join('')}
          </div>
        </div>

        <div class="sub-head">
          <h3>준비물 (${m.ings.length}개)</h3>
          <button class="btn-add" type="button" id="btnAddIng">+ 재료 추가</button>
        </div>
        <div class="edit-list" id="ingList">
          ${m.ings.length === 0 ? '<div style="color:var(--ink-faint); font-size:14px; padding:12px; text-align:center">아직 재료가 없어요. 위의 "+ 재료 추가" 를 눌러서 넣어주세요.</div>' : m.ings.map((i, idx) => `
            <div class="edit-row">
              <div class="er-vis${replacingIngIdx === idx ? ' replacing' : ''}" data-replace-ing="${idx}" title="그림을 다른 것으로 바꿔요">${renderVisual(i.vis)}</div>
              <div class="er-fields">
                <input type="text" data-ing-field="name" data-idx="${idx}" value="${esc(i.name)}" placeholder="이름">
                <input type="text" data-ing-field="amt" data-idx="${idx}" value="${esc(i.amt)}" placeholder="양">
              </div>
              <button class="er-del" type="button" data-del-ing="${idx}" aria-label="재료 삭제">×</button>
            </div>
          `).join('')}
        </div>
        ${ingPickerHTML}

        <div class="sub-head">
          <h3>만드는 순서 (${m.steps.length}단계)</h3>
          <button class="btn-add" type="button" id="btnAddStep">+ 단계 추가</button>
        </div>
        <div class="edit-list" id="stepList">
          ${m.steps.length === 0 ? '<div style="color:var(--ink-faint); font-size:14px; padding:12px; text-align:center">아직 단계가 없어요. 위의 "+ 단계 추가" 를 눌러서 넣어주세요.</div>' : m.steps.map((s, idx) => `
            <div class="edit-row">
              <div class="er-num">${idx + 1}</div>
              <div class="er-vis${replacingStepIdx === idx ? ' replacing' : ''}" data-replace-step="${idx}" title="아이콘을 다른 것으로 바꿔요">${stepIcons[s.ic] || stepIcons.cup}</div>
              <div class="er-fields">
                <input type="text" data-step-field="t" data-idx="${idx}" value="${esc(s.t)}" placeholder="단계 설명">
              </div>
              <button class="er-del" type="button" data-del-step="${idx}" aria-label="단계 삭제">×</button>
            </div>
          `).join('')}
        </div>
        ${stepPickerHTML}
      </div>
      <div class="modal-foot">
        ${canDelete ? '<button class="btn-danger" type="button" id="btnDelete">메뉴 삭제</button>' : ''}
        <button class="btn-secondary" type="button" id="btnCancel">취소</button>
        <button class="btn-primary" type="button" id="btnSave">저장</button>
      </div>
    `;

    // Wire events
    modalEl.querySelector('#modalCloseBtn').addEventListener('click', closeModal);
    modalEl.querySelector('#btnCancel').addEventListener('click', closeModal);
    modalEl.querySelector('#btnSave').addEventListener('click', saveMenu);
    if (canDelete) modalEl.querySelector('#btnDelete').addEventListener('click', deleteMenu);

    modalEl.querySelector('#editName').addEventListener('input', (e) => {
      editingMenu.name = e.target.value;
    });

    modalEl.querySelectorAll('input[name="editCat"]').forEach(r => {
      r.addEventListener('change', (e) => {
        if (e.target.checked) {
          editingMenu.category = e.target.value;
          if (editingMenu.thumb) {
            editingMenu.thumb = { ...catDefaultThumb[editingMenu.category] };
          }
          renderModal();
        }
      });
    });

    modalEl.querySelectorAll('input[data-ing-field]').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = +e.target.dataset.idx;
        const field = e.target.dataset.ingField;
        if (editingMenu.ings[idx]) editingMenu.ings[idx][field] = e.target.value;
      });
    });
    modalEl.querySelectorAll('input[data-step-field]').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = +e.target.dataset.idx;
        const field = e.target.dataset.stepField;
        if (editingMenu.steps[idx]) editingMenu.steps[idx][field] = e.target.value;
      });
    });

    modalEl.querySelectorAll('[data-del-ing]').forEach(b => {
      b.addEventListener('click', (e) => {
        const idx = +e.currentTarget.dataset.delIng;
        editingMenu.ings.splice(idx, 1);
        renderModal();
      });
    });
    modalEl.querySelectorAll('[data-del-step]').forEach(b => {
      b.addEventListener('click', (e) => {
        const idx = +e.currentTarget.dataset.delStep;
        editingMenu.steps.splice(idx, 1);
        renderModal();
      });
    });

    modalEl.querySelector('#btnAddIng').addEventListener('click', () => {
      ingPickerOpen = !ingPickerOpen;
      replacingIngIdx = null;
      stepPickerOpen = false;
      replacingStepIdx = null;
      renderModal();
    });
    modalEl.querySelector('#btnAddStep').addEventListener('click', () => {
      stepPickerOpen = !stepPickerOpen;
      replacingStepIdx = null;
      ingPickerOpen = false;
      replacingIngIdx = null;
      renderModal();
    });

    if (ingPickerOpen) {
      modalEl.querySelectorAll('[data-ing-idx]').forEach(b => {
        b.addEventListener('click', (e) => {
          const idx = +e.currentTarget.dataset.ingIdx;
          const picked = clone(ING_GALLERY[idx]);
          if (replacingIngIdx !== null && editingMenu.ings[replacingIngIdx]) {
            editingMenu.ings[replacingIngIdx].vis = picked.vis;
          } else {
            editingMenu.ings.push(picked);
          }
          ingPickerOpen = false;
          replacingIngIdx = null;
          renderModal();
        });
      });
    }
    if (stepPickerOpen) {
      modalEl.querySelectorAll('[data-step-idx]').forEach(b => {
        b.addEventListener('click', (e) => {
          const idx = +e.currentTarget.dataset.stepIdx;
          const picked = clone(STEP_PALETTE[idx]);
          if (replacingStepIdx !== null && editingMenu.steps[replacingStepIdx]) {
            const current = editingMenu.steps[replacingStepIdx];
            editingMenu.steps[replacingStepIdx] = { ...picked, t: current.t };
          } else {
            editingMenu.steps.push(picked);
          }
          stepPickerOpen = false;
          replacingStepIdx = null;
          renderModal();
        });
      });
    }

    // Click a visual preview to replace it
    modalEl.querySelectorAll('[data-replace-ing]').forEach(el => {
      el.addEventListener('click', (e) => {
        const idx = +e.currentTarget.dataset.replaceIng;
        if (replacingIngIdx === idx) {
          replacingIngIdx = null; ingPickerOpen = false;
        } else {
          replacingIngIdx = idx; ingPickerOpen = true; stepPickerOpen = false;
        }
        renderModal();
        if (replacingIngIdx !== null) {
          const picker = modalEl.querySelector('#ingPicker');
          if (picker) picker.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    });
    modalEl.querySelectorAll('[data-replace-step]').forEach(el => {
      el.addEventListener('click', (e) => {
        const idx = +e.currentTarget.dataset.replaceStep;
        if (replacingStepIdx === idx) {
          replacingStepIdx = null; stepPickerOpen = false;
        } else {
          replacingStepIdx = idx; stepPickerOpen = true; ingPickerOpen = false;
        }
        renderModal();
        if (replacingStepIdx !== null) {
          const picker = modalEl.querySelector('#stepPicker');
          if (picker) picker.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    });
  }

  function saveMenu() {
    const m = editingMenu;
    if (!m) return;
    if (!m.name || !m.name.trim()) { alert('이름을 입력해 주세요.'); return; }
    if (m.ings.length === 0) { alert('재료를 1개 이상 추가해 주세요.'); return; }
    if (m.steps.length === 0) { alert('단계를 1개 이상 추가해 주세요.'); return; }

    // Clean fields
    m.name = m.name.trim();
    m.sub = m.sub || '';
    if (!m.thumb) m.thumb = { ...catDefaultThumb[m.category] };

    if (isDefaultMenu(m.category, m.id)) {
      const overrides = loadOverrides();
      overrides[`${m.category}:${m.id}`] = m;
      saveOverrides(overrides);
    } else {
      // Custom menu — add or update
      const custom = loadCustom();
      const idx = custom.findIndex(x => x.id === m.id);
      if (idx >= 0) custom[idx] = m;
      else custom.push(m);
      saveCustom(custom);
    }
    const savedCat = m.category;
    closeModal();
    if (currentCat !== savedCat) {
      currentCat = savedCat;
      setCatVars(document.documentElement, currentCat);
      renderTabs();
    }
    renderMenu();
    recipeEl.hidden = true;
    menuEl.hidden = false;
  }

  function deleteMenu() {
    const m = editingMenu;
    if (!m) return;
    if (!confirm(`"${m.name}" 메뉴를 삭제할까요?`)) return;
    if (isDefaultMenu(m.category, m.id)) {
      const deleted = loadDeleted();
      const key = `${m.category}:${m.id}`;
      if (!deleted.includes(key)) deleted.push(key);
      saveDeleted(deleted);
      // Also clear its override
      const overrides = loadOverrides();
      if (overrides[key]) { delete overrides[key]; saveOverrides(overrides); }
    } else {
      const custom = loadCustom().filter(x => x.id !== m.id);
      saveCustom(custom);
    }
    closeModal();
    renderMenu();
    recipeEl.hidden = true;
    menuEl.hidden = false;
  }

  modalBackdropEl.addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modalEl.hidden) closeModal();
  });

  /* ============ Safety page ============ */
  const safetyPageEl = document.getElementById('safetyPage');
  const safetyBtnEl = document.getElementById('safetyBtn');

  function openSafetyPage(highlightKey) {
    renderSafetyPage(highlightKey);
    safetyPageEl.hidden = false;
    menuEl.hidden = true;
    recipeEl.hidden = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function closeSafetyPage() {
    safetyPageEl.hidden = true;
    menuEl.hidden = false;
  }
  function renderSafetyPage(highlightKey) {
    const highlight = highlightKey && WARN_INFO[highlightKey] ? WARN_INFO[highlightKey].section : null;
    safetyPageEl.innerHTML = `
      <div class="recipe-head">
        <button class="back-btn" type="button" id="safetyBackBtn" aria-label="메뉴로 돌아가기">←</button>
        <div class="recipe-title">
          <span class="cat-label" style="background:#FFEDE0; color:#B6411F">🚨 꼭 지켜요</span>
          <h2 id="safetyTitle">음료 조제 안전 수칙</h2>
        </div>
      </div>
      <div class="safety-intro">
        음료를 만들기 전에 꼭 읽어요. <b>뜨거운 물</b>, <b>에스프레소 머신</b>, <b>그라인더</b>, <b>믹서기</b>, <b>유리컵</b>은 다칠 수 있어요. 어려우면 선생님께 도와달라고 말해요.
      </div>
      <div class="safety-grid">
        ${SAFETY_SECTIONS.map(s => `
          <div class="safety-card" id="sc-${esc(s.title)}" style="--sc-color:${s.color};--sc-tint:${s.tint};${highlight === s.title ? 'box-shadow:0 0 0 4px ' + s.color + '55' : ''}">
            <div class="sc-head">
              <div class="sc-icon">${s.icon}</div>
              <h3>${esc(s.title)}</h3>
            </div>
            <ul>
              ${s.rules.map(r => `<li>${esc(r)}</li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
    `;
    safetyPageEl.querySelector('#safetyBackBtn').addEventListener('click', closeSafetyPage);
    if (highlight) {
      const card = safetyPageEl.querySelector(`#sc-${CSS.escape(highlight)}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  safetyBtnEl.addEventListener('click', () => openSafetyPage());

  // Clicking a warn chip inside a step opens the safety page at that section
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.step-warn');
    if (!chip) return;
    e.stopPropagation();
    e.preventDefault();
    openSafetyPage(chip.dataset.warn);
  }, true);

  /* ============ Theme & edit-mode toggles ============ */
  function applyTheme(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    saveTheme(t);
  }
  applyTheme(loadTheme());
  themeTog.addEventListener('click', () => {
    const curr = document.documentElement.getAttribute('data-theme');
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = curr === 'dark' || (!curr && sysDark);
    applyTheme(isDark ? 'light' : 'dark');
  });

  const editHeaderBtn = document.getElementById('editHeaderBtn');
  const editHintEl = document.getElementById('editHint');
  function applyEditMode(on) {
    document.body.classList.toggle('edit-mode', !!on);
    editTog.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (editHeaderBtn) editHeaderBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (editHintEl) editHintEl.hidden = !on;
    saveEditMode(!!on);
  }
  applyEditMode(loadEditMode());
  function toggleEditMode() {
    applyEditMode(!document.body.classList.contains('edit-mode'));
  }
  editTog.addEventListener('click', toggleEditMode);
  if (editHeaderBtn) editHeaderBtn.addEventListener('click', toggleEditMode);

  /* ============ Init ============ */
  setCatVars(document.documentElement, currentCat);
  renderTabs();
  renderMenu();
</script>
